<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You! | KAS Waterproofing & Building Services</title>
    <link rel="icon" type="image/png" href="/images/logo/logo-dark.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .success-shell {
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 140px 6% 90px;
            background: var(--bg-light);
        }
        .success-card {
            max-width: 560px;
            background: #fff;
            border-radius: var(--radius-large);
            box-shadow: var(--shadow-soft);
            padding: 56px 44px;
        }
        .success-icon {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            background: var(--gradient-gold);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 2.2rem;
        }
        .success-card h1 {
            color: var(--primary);
            font-size: clamp(1.8rem, 4vw, 2.4rem);
            margin-bottom: 14px;
        }
        .success-card p {
            color: var(--text-light);
            font-size: 1.05rem;
            margin-bottom: 30px;
        }
        .success-card a.btn-main {
            font-size: 1rem;
        }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DH4HQ9VTEZ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-DH4HQ9VTEZ');
    </script>
</head>
<body>
    <div id="header"></div>

    <section class="success-shell">
        <div class="success-card reveal is-visible">
            <div class="success-icon">✓</div>
            <h1>Message Sent!</h1>
            <p>Thanks for contacting KAS Waterproofing &amp; Building Services. A member of our team will get back to you shortly.</p>
            <a href="/" class="btn-main shimmer-btn">Return to Home</a>
        </div>
    </section>

    <div id="footer"></div>

    <script src="assets/js/chat.js"></script>
    <script src="assets/js/site.js"></script>
</body>
</html>
