<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - KAS Waterproofing</title>
    <link rel="icon" type="image/png" href="/images/logo/logo-dark.png">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .admin-shell {
            padding: 140px 6% 80px;
            background-color: #f4f6fa;
            min-height: 100vh;
        }

        .admin-shell h1 {
            color: var(--primary);
            font-weight: 800;
            font-size: 2.1em;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .admin-shell > p {
            color: var(--text-light);
        }

        .admin-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 14px 0;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logout-btn {
            padding: 10px 22px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: var(--radius-small);
            cursor: pointer;
            font-weight: 700;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
        }

        .admin-tabs {
            display: flex;
            gap: 10px;
            margin: 18px 0 6px;
        }

        .admin-tab {
            padding: 10px 22px;
            border: 2px solid var(--primary);
            background: white;
            color: var(--primary);
            border-radius: var(--radius-small);
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .admin-tab:hover,
        .admin-tab.active {
            background: var(--gradient-navy);
            color: white;
            border-color: var(--primary);
        }

        .admin-panel {
            display: none;
        }

        .admin-panel.active {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 16px;
            box-shadow: var(--shadow-soft);
            border-radius: var(--radius-medium);
            overflow: hidden;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eaeaea;
        }

        th {
            background: var(--gradient-navy);
            color: white;
            letter-spacing: 0.6px;
            font-size: 1.02em;
        }

        tr {
            transition: background 0.3s, box-shadow 0.3s;
        }

        tr:hover {
            background-color: #eef3fb;
        }

        .fade-in-row {
            opacity: 0;
            transform: translateY(18px);
            animation: fadeInUp 0.6s cubic-bezier(.4,2,.6,1) forwards;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .status-select {
            padding: 8px 12px;
            border-radius: 20px;
            border: 2px solid;
            font-weight: 700;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .status-pending { background-color: #fff3cd; color: #856404; border-color: #ffc107; }
        .status-replied { background-color: #d1ecf1; color: #0c5460; border-color: #17a2b8; }
        .status-rejected { background-color: #f8d7da; color: #721c24; border-color: #dc3545; }
        .status-approved { background-color: #d4edda; color: #155724; border-color: #28a745; }
        .status-processing { background-color: #e2e3e5; color: #383d41; border-color: #6c757d; }

        .status-select:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .filter-container {
            margin: 20px 0 0;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 9px 18px;
            border: 2px solid var(--primary);
            background: white;
            color: var(--primary);
            border-radius: var(--radius-small);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--primary);
            color: white;
        }

        .stats-container {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: var(--radius-medium);
            box-shadow: var(--shadow-soft);
            min-width: 140px;
            text-align: center;
        }

        .stat-number {
            font-size: 1.9em;
            font-weight: 800;
            color: var(--primary);
        }

        .stat-label {
            color: #666;
            font-size: 0.88em;
            margin-top: 5px;
        }

        .empty-note {
            padding: 30px;
            text-align: center;
            color: var(--text-light);
        }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DH4HQ9VTEZ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-DH4HQ9VTEZ');
    </script>
</head>
<body>
    <div id="header"></div>

    <div class="admin-shell">
        <h1>Admin Dashboard</h1>
        <p>Manage and track all customer inquiries and chat leads from your website.</p>

        <div class="admin-toolbar">
            <div class="admin-tabs">
                <button class="admin-tab active" id="tab-clients" onclick="switchTab('clients')">Contact Inquiries</button>
                <button class="admin-tab" id="tab-leads" onclick="switchTab('leads')">Chat Leads</button>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <!-- CONTACT INQUIRIES PANEL -->
        <div class="admin-panel active" id="panel-clients">
            <div class="stats-container" id="stats"></div>

            <div class="filter-container">
                <button class="filter-btn active" onclick="filterStatus('all')">All</button>
                <button class="filter-btn" onclick="filterStatus('pending')">Pending</button>
                <button class="filter-btn" onclick="filterStatus('processing')">Processing</button>
                <button class="filter-btn" onclick="filterStatus('replied')">Replied</button>
                <button class="filter-btn" onclick="filterStatus('approved')">Approved</button>
                <button class="filter-btn" onclick="filterStatus('rejected')">Rejected</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Service</th>
                        <th>Message</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>

        <!-- CHAT LEADS PANEL -->
        <div class="admin-panel" id="panel-leads">
            <div class="stats-container" id="leads-stats"></div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Service</th>
                        <th>Message</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="leads-table-body"></tbody>
            </table>
        </div>
    </div>

    <script src="../assets/js/site.js"></script>
    <script>
        let allClients = [];
        let allLeads = [];

        function switchTab(tab) {
            document.getElementById('tab-clients').classList.toggle('active', tab === 'clients');
            document.getElementById('tab-leads').classList.toggle('active', tab === 'leads');
            document.getElementById('panel-clients').classList.toggle('active', tab === 'clients');
            document.getElementById('panel-leads').classList.toggle('active', tab === 'leads');
        }

        // Check authentication on page load
        async function checkAuth() {
            const token = sessionStorage.getItem('adminToken');

            if (!token) {
                window.location.href = '/login';
                return false;
            }

            try {
                const response = await fetch('/api/admin/verify', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    sessionStorage.removeItem('adminToken');
                    window.location.href = '/login';
                    return false;
                }

                return true;
            } catch (error) {
                console.error('Auth check failed:', error);
                window.location.href = '/login';
                return false;
            }
        }

        async function logout() {
            const token = sessionStorage.getItem('adminToken');

            if (token) {
                try {
                    await fetch('/api/admin/logout', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                } catch (error) {
                    console.error('Logout error:', error);
                }
            }

            sessionStorage.removeItem('adminToken');
            window.location.href = '/login';
        }

        // ===== CONTACT INQUIRIES =====

        async function loadClients() {
            const token = sessionStorage.getItem('adminToken');

            try {
                const response = await fetch('/api/clients', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        window.location.href = '/login';
                        return;
                    }
                    throw new Error('Failed to fetch clients');
                }

                const data = await response.json();
                allClients = data;
                displayClients(data);
                updateStats(data);
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function displayClients(clients) {
            const table = document.getElementById('table-body');
            table.innerHTML = '';

            if (!clients.length) {
                table.innerHTML = '<tr><td colspan="8" class="empty-note">No contact form submissions yet.</td></tr>';
                return;
            }

            clients.forEach((client, i) => {
                const row = `<tr class="fade-in-row" style="animation-delay:${i * 0.05}s" data-status="${client.status}">
                    <td>${client.id}</td>
                    <td><strong>${escapeHtml(client.name)}</strong></td>
                    <td>${escapeHtml(client.email)}</td>
                    <td>${escapeHtml(client.phone) || 'N/A'}</td>
                    <td>${escapeHtml(client.service)}</td>
                    <td>${escapeHtml(client.message)}</td>
                    <td>${new Date(client.createdAt).toLocaleDateString()}</td>
                    <td>
                        <select class="status-select status-${client.status}"
                                onchange="updateStatus(${client.id}, this.value)"
                                data-client-id="${client.id}">
                            <option value="pending" ${client.status === 'pending' ? 'selected' : ''}>Pending</option>
                            <option value="processing" ${client.status === 'processing' ? 'selected' : ''}>Processing</option>
                            <option value="replied" ${client.status === 'replied' ? 'selected' : ''}>Replied</option>
                            <option value="approved" ${client.status === 'approved' ? 'selected' : ''}>Approved</option>
                            <option value="rejected" ${client.status === 'rejected' ? 'selected' : ''}>Rejected</option>
                        </select>
                    </td>
                </tr>`;
                table.innerHTML += row;
            });
        }

        async function updateStatus(clientId, newStatus) {
            const token = sessionStorage.getItem('adminToken');

            try {
                const response = await fetch(`/api/clients/${clientId}/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                if (response.ok) {
                    const selectElement = document.querySelector(`select[data-client-id="${clientId}"]`);
                    if (selectElement) {
                        selectElement.className = `status-select status-${newStatus}`;
                    }

                    const row = selectElement.closest('tr');
                    if (row) {
                        row.setAttribute('data-status', newStatus);
                    }

                    loadClients();
                } else {
                    alert('Failed to update status');
                }
            } catch (error) {
                console.error('Error updating status:', error);
                alert('Error updating status');
            }
        }

        function filterStatus(status) {
            document.querySelectorAll('#panel-clients .filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            const rows = document.querySelectorAll('#table-body tr');
            rows.forEach(row => {
                if (status === 'all') {
                    row.style.display = '';
                } else {
                    const rowStatus = row.getAttribute('data-status');
                    row.style.display = rowStatus === status ? '' : 'none';
                }
            });
        }

        function updateStats(clients) {
            const stats = {
                total: clients.length,
                pending: clients.filter(c => c.status === 'pending').length,
                processing: clients.filter(c => c.status === 'processing').length,
                replied: clients.filter(c => c.status === 'replied').length,
                approved: clients.filter(c => c.status === 'approved').length,
                rejected: clients.filter(c => c.status === 'rejected').length
            };

            document.getElementById('stats').innerHTML = `
                <div class="stat-card"><div class="stat-number">${stats.total}</div><div class="stat-label">Total Inquiries</div></div>
                <div class="stat-card"><div class="stat-number">${stats.pending}</div><div class="stat-label">Pending</div></div>
                <div class="stat-card"><div class="stat-number">${stats.processing}</div><div class="stat-label">Processing</div></div>
                <div class="stat-card"><div class="stat-number">${stats.replied}</div><div class="stat-label">Replied</div></div>
                <div class="stat-card"><div class="stat-number">${stats.approved}</div><div class="stat-label">Approved</div></div>
                <div class="stat-card"><div class="stat-number">${stats.rejected}</div><div class="stat-label">Rejected</div></div>
            `;
        }

        // ===== CHAT LEADS =====

        async function loadLeads() {
            const token = sessionStorage.getItem('adminToken');

            try {
                const response = await fetch('/api/leads', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        window.location.href = '/login';
                        return;
                    }
                    throw new Error('Failed to fetch leads');
                }

                const data = await response.json();
                allLeads = data;
                displayLeads(data);
                updateLeadsStats(data);
            } catch (error) {
                console.error('Error loading leads:', error);
            }
        }

        function displayLeads(leads) {
            const table = document.getElementById('leads-table-body');
            table.innerHTML = '';

            if (!leads.length) {
                table.innerHTML = '<tr><td colspan="6" class="empty-note">No chat leads yet. Leads captured through the "Ask KAS" chat widget will appear here.</td></tr>';
                return;
            }

            leads.forEach((lead, i) => {
                const row = `<tr class="fade-in-row" style="animation-delay:${i * 0.05}s">
                    <td>${lead.id}</td>
                    <td><strong>${escapeHtml(lead.name)}</strong></td>
                    <td>${escapeHtml(lead.phone)}</td>
                    <td>${escapeHtml(lead.service) || 'N/A'}</td>
                    <td>${escapeHtml(lead.message)}</td>
                    <td>${new Date(lead.createdAt).toLocaleDateString()}</td>
                </tr>`;
                table.innerHTML += row;
            });
        }

        function updateLeadsStats(leads) {
            document.getElementById('leads-stats').innerHTML = `
                <div class="stat-card"><div class="stat-number">${leads.length}</div><div class="stat-label">Total Chat Leads</div></div>
            `;
        }

        // Initialize on page load
        (async function init() {
            const authenticated = await checkAuth();
            if (authenticated) {
                loadClients();
                loadLeads();
            }
        })();
    </script>
</body>
</html>
