<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - KAS Waterproofing</title>
    <link rel="icon" type="image/png" href="/images/logo/logo-dark.png">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .login-shell {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 150px 6% 60px;
            background: var(--gradient-navy);
        }

        .login-container {
            background: white;
            padding: 44px 40px;
            border-radius: var(--radius-large);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 420px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: var(--primary);
            font-size: 1.9em;
            margin-bottom: 8px;
        }

        .login-header p {
            color: var(--text-light);
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: var(--radius-small);
            font-size: 1em;
            font-family: inherit;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(227, 178, 60, 0.18);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--gradient-navy);
            color: white;
            border: none;
            border-radius: var(--radius-small);
            font-size: 1.05em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(11, 31, 58, 0.32);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: var(--radius-small);
            margin-bottom: 20px;
            display: none;
            font-size: 0.9em;
            border: 1px solid #f5c6cb;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .lock-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--gradient-gold);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6em;
            margin: 0 auto 14px;
        }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DH4HQ9VTEZ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-DH4HQ9VTEZ');
    </script>
</head>
<body>
    <div id="header"></div>

    <div class="login-shell">
        <div class="login-container reveal is-visible">
            <div class="login-header">
                <div class="lock-icon" aria-hidden="true">&#128274;</div>
                <h1>Admin Login</h1>
                <p>KAS Waterproofing &amp; Building</p>
            </div>

            <div id="error-message" class="error-message">
                Invalid password. Please try again.
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter admin password"
                        required
                        autofocus
                    >
                </div>

                <button type="submit" class="login-btn">
                    Login to Dashboard
                </button>
            </form>
        </div>
    </div>

    <script src="../assets/js/site.js"></script>
    <script>
        const loginForm = document.getElementById('login-form');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('error-message');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = passwordInput.value;

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    sessionStorage.setItem('adminToken', data.token);
                    window.location.href = '/admin';
                } else {
                    errorMessage.textContent = data.message || 'Invalid password. Please try again.';
                    errorMessage.classList.add('show');
                    passwordInput.value = '';
                    passwordInput.focus();

                    setTimeout(() => {
                        errorMessage.classList.remove('show');
                    }, 3000);
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = 'Login failed. Please try again.';
                errorMessage.classList.add('show');
            }
        });
    </script>
</body>
</html>
